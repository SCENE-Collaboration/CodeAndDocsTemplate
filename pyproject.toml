[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77" ]

[project]
name = "scene-repo-template"
description = "Create SCENE code projects: packaging, tests, CI and documentation already set up."
readme = "README.md"
license = "Apache-2.0" # keep in line with LICENSE
license-files = [ "LICENSE" ]
authors = [ { name = "SCENE Collaboration" } ]
requires-python = ">=3.10"
classifiers = [
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
]
dynamic = [ "version" ]
dependencies = [ "questionary>=2" ]

optional-dependencies.dev = [ "pre-commit", "pytest", "pytest-cov" ]
optional-dependencies.docs = [ "jupyter-book>=2" ]
scripts.scene-repo-template = "scene_repo_template.cli:main"
urls."Bug Tracker" = "https://github.com/SCENE-Collaboration/CodeAndDocsTemplate/issues"
urls.Source = "https://github.com/SCENE-Collaboration/CodeAndDocsTemplate"

[tool.setuptools]
packages.find.where = [ "src" ]
# The project skeleton ships as data: generated projects are copied from it.
package-data.scene_repo_template = [ "skeleton/**/*" ]

[tool.setuptools.dynamic]
version = { attr = "scene_repo_template.version.__version__" }

[tool.pytest.ini_options]
testpaths = [ "tests" ]
addopts = [ "-ra", "--strict-markers" ]
xfail_strict = true

[tool.ruff]
line-length = 120
# Contributed examples keep their authors' code as published.
extend-exclude = [ "docs/contributed-examples" ]
force-exclude = true

[tool.ruff.lint]
# Rules that catch bugs or that ruff fixes itself; style is left to `ruff format`.
select = [ "E4", "E7", "E9", "F", "B", "I", "UP", "PIE" ]
ignore = [ "E741", "B007" ]
per-file-ignores."*.ipynb" = [ "E402" ]

[tool.codespell]
skip = "*.ipynb,*.png,*.svg,_build"
